# PS 블로그 포스트 태그 매핑 — review-code의 "태그 후보" 추천이 참조하는 고정 어휘집.
# 설계 배경/검증 이력은 사용자 메모리 `ps-tag-taxonomy`(claude memory, 이 레포 밖) 참고.
#
# 사용법(review-code용):
#   0. 태그는 "기술적으로 해당되는지"가 아니라 "그 개념이 이 문제를 푸는 데 실질적으로
#      중요한지"로 고른다. 덧셈을 했다고 math, 코드를 썼다고 implementation을 붙이지
#      않는다 — 그 개념이 핵심 난이도일 때만 태그 자격이 있다. math/implementation은
#      거의 모든 문제에 기술적으로 걸릴 수 있어 남용 위험이 특히 큼(아래 boundary_notes 참고).
#   1. 코드가 실제로 쓰는 기법에 가장 구체적인(leaf에 가까운) 태그를 고른다.
#   2. 고른 태그의 parents를 재귀적으로 따라가 조상 태그를 전부 함께 후보로 낸다.
#      (예: `lazy propagation`을 고르면 `segment tree`, `data structure`도 같이 추천)
#   3. parents가 2개인 태그(다중부모, 아래 전부 `# 다중부모`로 표시됨)는 두 조상 라인을 각각 따라간다.
#   4. `contextual`이 있는 태그는 구조적 부모가 아니라 "이 문제가 그 성격이면 같이 추천"하는 판단 기준이다.
#      trie 하나뿐이며, 문자열 문제에서 trie를 쓰면 string도 같이 추천할지 판단한다.
#   5. `exception: true` 태그(constructive/ad hoc/warm up) 중 constructive/ad hoc는 "기법은
#      아니지만 뚜렷한 문제 성격(창의적 구성/임기응변)"이 있을 때, warm up은 그런 성격조차
#      없이 그냥 쉬운/사소한 문제일 때 쓴다. 셋 다 0번 기준까지 통과하는 기법 태그가 실질적으로
#      하나도 안 남는 경우의 최후 후보다(포스트에 태그 최소 1개 정책 때문에 존재) — "기술적으로는
#      뭔가 걸리지만 의미가 없어서" 후보가 안 남은 경우도 포함(math/implementation 남용 방지).
#      단, 이 "실질적으로 하나도 안 남는" 판단은 포스트 전체가 아니라 접근(`### 풀이`/`### 풀이 N`)
#      단위로 함(2026-08-27 확정, #120831/#120836에서 최초로 다중 접근 포스트가 생기며 정식화) —
#      한 포스트 안에 접근이 여러 개고 그 성격이 갈리면(하나는 사소한 완전탐색/사칙연산, 다른
#      하나는 실제 기법 사용), exception 태그와 그 실제 기법 태그를 병기한다. 예: 풀이1이 단순
#      순회, 풀이2가 등차수열 합공식이면 `warm up`+`math`. 풀이1이 브루트포스, 풀이2가 약수
#      쌍 성질(수론)이면 둘 다 진짜 기법이라 exception 없이 `brute force`+`number theory`+`math`.
#   6. 후보는 언급만 하고 실제 front matter 적용은 사용자가 "태그 달아줘"라고 명시했을 때만.
#      적용 시 태그는 예외 없이 전부 큰따옴표로 감쌀 것(아포스트로피 있는 태그만 따지지 않고 통일 —
#      매번 아포스트로피 유무를 판단할 필요를 없애기 위함). 작은따옴표는 아포스트로피 있는 태그에서
#      파싱이 깨지니 절대 쓰지 말 것. 예: `tags: ["mo's algorithm", "segment tree", "warm up"]`
#
# 표기 규칙: 소문자 + 띄어쓰기(케밥케이스 아님). 사람 이름이 실제로 소유격으로 쓰이는 경우만
# 아포스트로피 유지(mo's algorithm, fermat's little theorem, knuth's optimization, pollard's rho,
# lucas' theorem, euler's totient, kadane's algorithm). 두 사람 이름 합성이나 형용사형은 아포스트로피 없음
# (bellman ford, hopcroft karp, edmonds karp, miller rabin, aho corasick, sprague grundy,
# chinese remainder theorem, gaussian elimination, euclidean algorithm). 0-1 bfs, 2-sat은
# 숫자 표기 관용으로 하이픈 유지.

