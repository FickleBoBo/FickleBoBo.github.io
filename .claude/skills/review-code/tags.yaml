# PS 블로그 포스트 태그 매핑 — review-code의 "태그 후보" 추천이 참조하는 고정 어휘집.
# 설계 배경/검증 이력은 사용자 메모리 `ps-tag-taxonomy`(claude memory, 이 레포 밖) 참고.
#
# 사용법(review-code용) — 포스트의 접근(`### 풀이`/`### 풀이 N`)마다 아래를 순서대로 적용한다.
#   0. SQL 전용 포스트(언어 브래킷이 [MySQL] 하나뿐): `sql` 하나만 달고 끝낸다. 다른 태그와 병기하지
#      않고 아래 단계도 거치지 않는다.
#   1. 도메인 태그(`string`, `geometry`): 문제가 그 도메인에 속하고 풀이가 그 도메인 작업(글자 단위
#      처리, 좌표/도형 판정 등)을 드러내면 난이도가 사소해도 붙인다. 아래 2번의 "핵심 난이도" 바를
#      걸지 않는다. 판단 기준은 boundary_notes. 도메인 태그가 붙으면 warm up은 병기하지 않는다(5번).
#   2. 기법 태그: 코드가 실제로 쓰는 기법 중 이 문제를 푸는 데 실질적으로 중요한 것을 고른다.
#      - 가장 구체적인(leaf에 가까운) 태그를 고른다. 이름이 비슷하다고 고르지 않는다 — 코드가 그
#        알고리즘/자료구조를 실제로 구현·사용할 때만(특히 고급 알고리즘).
#      - "핵심 난이도" 바: 기술적으로 해당되는지가 아니라, 그 개념을 모르면 풀기 어렵거나 정확히
#        구현하는 것 자체가 어려운지로 고른다. 덧셈을 했다고 math, 코드를 썼다고 implementation을
#        붙이지 않는다. math/implementation은 거의 모든 문제에 기술적으로 걸릴 수 있어 남용 위험이
#        특히 크다(boundary_notes `[implementation, math, warm up]`).
#      - math는 수학적 아이디어나 관찰이 필요한 풀이에 붙인다(공식 유도, 규칙성 발견 포함). 지문이
#        준 공식·판정 기준을 그대로 적용만 하면 붙이지 않는다. 난이도에 따라 경계가 애매할 수 있다.
#      - 자료구조 태그(stack, queue, deque, priority queue, hash table, ordered set 등)는 그
#        자료구조가 풀이의 핵심일 때만 붙인다. 이미 고른 알고리즘 태그가 그 자료구조를 암묵적으로
#        포함하면 붙이지 않는다(bfs→queue, dijkstra→priority queue, kruskal→union find). 단 그 자료구조
#        자체가 풀이의 핵심이면(예: 가중치 DSU, 롤백) 붙인다.
#      - 시뮬레이션(상태가 시간에 따라 변하는 절차를 그대로 재현)은 별도 태그 없이 implementation이다.
#   3. 조상 펼치기: 고른 태그의 parents를 재귀로 따라가 조상 태그를 전부 후보로 낸다(예: `lazy
#      propagation` → `segment tree`, `data structure`). parents가 2개인 태그(`# 다중부모`)는 두
#      라인을 각각 따라간다. 하위만 골라도 상위 모음 페이지에 모이게 하는 의도된 정책이다.
#      `contextual`이 있는 태그(trie, lcs)는 구조적 부모가 아니라 판단 기준이다 — 문자열 문제에서
#      trie를 쓰거나 문자열에 대한 lcs(수열 lcs는 해당 없음)면 string도 같이 추천할지 판단한다.
#   4. 예외 태그(`exception: true`: constructive/ad hoc/warm up): 1~2번을 통과한 태그가 하나도
#      안 남은 접근의 최후 후보다(포스트에 태그 최소 1개 정책 때문에 존재). "기술적으로는 뭔가
#      걸리지만 의미가 없어서" 후보가 안 남은 경우도 포함. constructive/ad hoc는 기법은 아니지만
#      뚜렷한 문제 성격(창의적 구성/임기응변)이 있을 때, warm up은 그런 성격조차 없이 그냥
#      쉬운/사소한 문제일 때.
#   5. 다중 접근과 병기: 접근마다 1~4번을 따로 판정하고 포스트 태그는 합집합이다.
#      - warm up은 "달리 할 말이 없다"는 신호라, 접근이 하나뿐이면 기법/도메인 태그와 병기하지 않는다.
#        병기는 warm up급 접근과 다른 태그(기법·도메인)가 붙을 접근이 한 포스트에 공존할 때만(예: 풀이1 단순 순회, 풀이2
#        등차수열 합공식 → `warm up`+`math`). 둘 다 진짜 기법이면 exception 없이(예: 풀이1
#        브루트포스, 풀이2 약수 쌍 성질 → `brute force`+`number theory`+`math`).
#      - constructive/ad hoc는 단일 접근이어도 실기법 태그와 병기할 수 있다. 그 기법이 "왜 이 답이
#        정답인지"를 설명하면 기법 태그만, "어떻게 효율적으로 구현하는지"만 설명하는 구현 수단이면
#        병기한다(예: 금지구간을 표시하는 difference array — 핵심은 "여집합이 항상 안전한 구성"이라는
#        증명). 이 기준을 통과할 때만이고 무조건은 아니다.
#   6. `interactive`는 문제 형식 태그라 위 판정과 독립이다 — 인터랙티브 문제면 다른 태그와 함께 붙인다.
#      다른 태그가 없어도 interactive가 최소 1개를 채우므로 warm up은 병기하지 않는다.
#
# 후보는 언급까지만 한다. 파일 적용·표기는 SKILL.md(`apply_tags.py`)가 맡는다.
#
# 표기 규칙: 소문자 + 띄어쓰기(케밥케이스 아님). 사람 이름이 실제로 소유격으로 쓰이는 경우만
# 아포스트로피 유지(mo's algorithm, fermat's little theorem, knuth's optimization, pollard's rho,
# lucas' theorem, euler's totient, kadane's algorithm). 두 사람 이름 합성이나 형용사형은 아포스트로피 없음
# (bellman ford, hopcroft karp, edmonds karp, miller rabin, aho corasick, sprague grundy,
# chinese remainder theorem, gaussian elimination, euclidean algorithm). 0-1 bfs, 2-sat은
# 숫자 표기 관용으로 하이픈 유지.

