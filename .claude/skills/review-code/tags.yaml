# 경계가 애매한 태그 쌍 — 트리 구조만으로는 안 갈라져서 후보 고를 때 아래 기준으로 판단.
boundary_notes:
  - pair: [bit manipulation, bitmask, bitmask dp]
    rule: >
      bit manipulation은 XOR/AND/시프트 등 비트 자체의 성질을 이용하는 트릭(비트 개수 세기, XOR 소거,
      2의 거듭제곱 판정). bitmask는 부분집합을 정수 하나로 인코딩해 다루는 표현 방식 그 자체로,
      bit manipulation이 조상으로 자동 붙는다. bitmask dp는 그 bitmask를 DP 상태로 쓰는 경우 —
      dynamic programming과 bitmask(와 그 조상)가 함께 붙는다.
  - pair: [two pointers, sliding window]
    rule: >
      두 태그는 병렬이다(한쪽이 다른 쪽의 부모가 아님). two pointers는 정렬된/단조성 있는 배열에서 두
      포인터가 각자 독립적으로(또는 서로 반대 방향으로) 이동하며 조건을 좁혀가는 경우. sliding window는
      "연속된 구간"을 유지한 채 한쪽 끝을 늘리고 반대쪽을 줄이며 조건을 만족하는 구간을 찾는 경우.
      구현이 비슷해 보여도 무엇을 유지하는지로 구분. prefix sum과는 별개 — 누적합 배열을 만들어
      구간합을 질의하면 prefix sum, 윈도우 끝을 밀며 값을 갱신하면 sliding window.
  - pair: [two pointers, "floyd's cycle detection"]
    rule: >
      floyd's cycle detection(토끼와 거북이)은 배열 인덱싱이 아니라 어떤 값에서 다음 값을 결정하는
      함수 f(x)로 정의된 암묵적 연결 리스트/그래프 위에서, 서로 다른 속도(1스텝/2스텝)로 도는 두
      포인터가 사이클에 들어서면 반드시 만난다는 성질로 사이클 여부·시작점을 찾는 기법이다. "두 포인터"라는
      표면적 유사성과 무관하게 배열이 아니라 함수형 시퀀스 위에서 동작한다는 게 구분 기준.
  - pair: [implementation, math, warm up]
    rule: >
      implementation과 math는 거의 모든 문제에 기술적으로 걸릴 수 있어 남용 위험이 크다. math는 수학적
      아이디어나 관찰이 필요할 때(예: 등차수열 합공식 유도, 규칙성 발견) 붙인다 — 한 줄 공식이어도
      그 공식을 스스로 떠올려야 하면 math. number theory/combinatorics 등 하위 태그에 속하면 그
      하위 태그를 고른다(math 조상은 자동으로 붙음). 하위 태그에 안 맞는 관찰이면 math 단독.
      implementation은 풀이 아이디어는 분명한데 문제를 코드로 옮겨 풀어내는 것 자체가 핵심 난이도일 때
      붙인다(규칙이 긴 시뮬레이션, 복잡한 상태·분기·엣지케이스 처리, 큰 수 직접 연산 등).
      덧셈·비교·내장 함수 호출처럼 아이디어도 상태 관리도 필요 없으면 둘 다 붙이지 않고 warm up.
      지문이 판정 기준·정리를 그대로 제시하고(예: "9로 나눈 나머지는 각 자리 숫자 합의 나머지,
      이 사실을 이용하여") 남은 작업이 그걸 기계적으로 적용하는 수준이면 그 개념은 풀이의 crux가
      아니라 주어진 조건이므로 math/number theory를 붙이지 않고 warm up. 단 지문이 기준은 주되
      방법은 안 알려주면(예: 유한소수 판별 — 분모 소인수가 2·5뿐이라는 기준만 주고 기약분수화는
      안 알려줌) 풀이가 가져온 기법(euclidean algorithm 등)과 그 조상은 그대로 단다.
  - pair: [brute force, backtracking, warm up]
    rule: >
      brute force는 "이건 완전 탐색으로 푸는 문제구나"라는 인식 자체가 풀이의 아이디어일 때 — 탐색 공간
      설계나 "범위가 작으니 다 해봐도 된다"는 판단이 풀이의 핵심. 지문이 시키는 대로 훑으며 계산·세기만
      하면(이중 루프여도) 아이디어 없이 완전 탐색을 한 것이라 warm up. backtracking은 재귀로 상태를
      쌓고 되돌리며(undo) 가지치기하는 경우 — 가지치기 없는 재귀 열거는 brute force. dfs/bfs가
      붙으면 brute force는 중복이라 뺀다.
  - pair: [dfs, bfs, flood fill, shortest path]
    rule: >
      dfs는 그래프·트리를 깊이 우선으로 순회하는 경우(visited 유무 무관, 조합 구성용 재귀는 아님).
      bfs는 큐로 레벨 순회하는 경우 — 큐로 절차를 흉내 내는 시뮬레이션(프린터 등)은 bfs가 아니다.
      격자 최단거리는 bfs만 붙이고, 가중치가 있어 최단경로 알고리즘(dijkstra 등)을 쓸 때만 shortest
      path 계열. flood fill은 연결 영역을 칠하거나 세는 문제일 때만 bfs/dfs와 병기한다.
  - pair: [greedy, dynamic programming, constructive, ad hoc]
    rule: >
      greedy는 매 단계 국소 최선을 고르고 그것이 전체 최적이 되는 근거(교환 논증 등)가 성립하는
      접근일 때(정렬·우선순위 큐 기반 포함). 코드 구조만으로 안 가려지면 포스트의 아이디어 서술이
      있는 경우 그 근거 서술까지 함께 보고 판단한다. dynamic programming은 부분문제 점화식(표/메모)이
      있을 때 — prefix max를 한 번 스캔하는 정도는 dp가 아니다. constructive는 조건을 만족하는 답(배열·문자열 등)을 직접
      만들어내고 그 구성의 정당성이 핵심일 때. ad hoc은 어느 정형 기법에도 안 속하고 관찰 하나로
      풀릴 때. constructive와 ad hoc은 서로 무관한 축이라 한 문제에 둘 다 붙을 수 있다.
  - pair: [sorting, greedy]
    rule: >
      sorting은 문제가 정렬 자체를 요구하거나(정렬 기준 설계 포함) 정렬이 풀이의 전제/아이디어
      (정렬 후 인접 비교, sort+greedy, sort+two pointers)일 때. 출력 순서를 맞추려는 부수적 정렬은
      태그하지 않는다.
  - pair: [hash table, ordered set, string hashing]
    rule: >
      (자료구조 태그 일반 원칙은 사용법 2번: 풀이의 핵심일 때만, 알고리즘 태그가 암묵 포함하면 생략.
      LeetCode의 자료구조 설계 문제(LRU 캐시 등)는 data structure와 핵심 구조 태그만 붙인다.)
      hash table은 해시 기반 set/map(HashSet/HashMap, unordered_map, dict/set)을 아우르고, 조회·카운트·
      존재 판정이 풀이의 핵심일 때만 붙인다 — 단순 기록용이면 태그하지 않는다. ordered set은 정렬된
      set/map(TreeSet/TreeMap, std::set/map, PBDS)에서 순서 질의(lower_bound, floor/ceiling,
      최솟값·최댓값 삭제)가 핵심일 때 — 단순 정렬·중복 제거 용도면 아니다. string hashing은 롤링
      해시로 문자열을 비교하는 경우이고 set에 해시를 모으는 것만으론 hash table을 추가하지 않는다.
  - pair: [tree, graph]
    rule: >
      tree는 graph의 자식이 아닌 독립 태그다. 입력이 트리여도 단순 순회(bfs/dfs)면 graph 계열,
      조상·서브트리·트리 성질을 쓰면 tree 계열.
  - pair: [divide and conquer, divide and conquer optimization]
    rule: >
      divide and conquer optimization은 DP 점화식의 최적 분할점 단조성을 이용하는 최적화(dp optimization
      자식)다. 일반 분할 정복·병합 정렬형 풀이는 divide and conquer.
  - pair: [geometry, pythagorean theorem, warm up]
    rule: >
      geometry는 좌표/도형에 대한 판정·계산(거리, 넓이, 방향, 삼각형 성립 판정, 겹침)이면 풀이가
      사소해도 붙이고 warm up은 뺀다. 격자 이동·2차원 배열 조작은 geometry가 아니다. pythagorean
      theorem은 정수 해/빗변 정수성 판정이 풀이의 핵심일 때 geometry와 함께 붙이고, 거리 공식 대입
      수준이면 geometry만.
  - pair: [string, warm up]
    rule: >
      string은 math/implementation과 달리 "핵심 난이도" 바를 요구하지 않는 도메인 태그다 — 난이도 등급이
      아니라 주제 라벨이므로, 풀이가 내장함수 한 줄이어도 "이건 문자열 문제"가 참이면 붙인다(그러면
      warm up은 뺀다). 판단은 코드 길이가 아니라 문제의 본질로: 문제가 문자열을 들여다보거나 바꾸라고
      하나? → string. 구체적으로 (a) 들여다보기/바꾸기 = 필터·탐색·매칭·슬라이스·뒤집기·재배열·파싱·
      카운트·split·splice 중 하나라도면 string. (b) 문자열 출력만 = echo, 두 개 이어붙여 출력, n번 반복
      같이 다른 로직이 없으면 warm up. (c) 문자열↔숫자 통째 변환(parseInt/int(), toString/str())은 string 조작이
      아니다 — 변환만 하고 핵심이 그 숫자의 비교/연산이면 string을 붙이지 않는다(warm up 등 다른 판정).
      문자를 자르거나 들여다보는 순간부터는 (a)다.
