# 경계가 애매한 태그 쌍 — 트리 구조만으로는 안 갈라져서 후보 고를 때 아래 기준으로 판단.
boundary_notes:
  - pair: [bit manipulation, bitmask, bitmask dp]
    rule: >
      bit manipulation은 XOR/AND/시프트 등 비트 자체의 수학적 성질을 이용하는 트릭.
      bitmask는 부분집합을 정수 하나로 인코딩해서 다루는 표현 방식 그 자체(상태 자체가 목적).
      bitmask dp는 그 bitmask를 DP 상태로 쓰는 경우 — dynamic programming 조상이 자동으로 붙으니
      bitmask와 별개로 취급.
  - pair: [two pointers, sliding window]
    rule: >
      two pointers는 정렬된/단조성 있는 배열에서 두 포인터가 각자 독립적으로(또는 서로 반대 방향으로)
      이동하며 조건을 좁혀가는 경우. sliding window는 "연속된 구간"을 유지한 채 한쪽 끝을 늘리고
      반대쪽을 줄이며 조건을 만족하는 구간을 찾는 경우. 구현이 비슷해 보여도 무엇을 유지하는지로 구분.
  - pair: [implementation, math, warm up]
    rule: >
      implementation과 math는 사실상 모든 문제에 기술적으로 걸릴 수 있는 태그라 남용 위험이 제일 크다.
      사칙연산 한 줄, 조건문 하나, 내장 함수 호출 정도로 끝나는 문제엔 둘 다 붙이지 않고 warm up으로
      대체한다. "덧셈을 했으니 math", "코드를 썼으니 implementation"처럼 기술적 해당 여부만으로 고르지
      말 것 — 그 개념이 문제의 핵심 난이도일 때만 붙인다(정수론적 성질을 실제로 이용해야 풀리면 math,
      복잡한 상태를 놓치지 않고 정확히 구현해야 하면 implementation).
